# 发布工作流：推送 v* 标签时创建 GitHub Release
#
# 用法：
#   git tag v2.2.0 && git push origin v2.2.0
#
# 本项目是脚本/技能（无编译产物），Release 附带一个干净的源码快照
# （git archive，自动排除 offline/、.git 等未跟踪内容）。
# 多架构 Docker 镜像请在各自环境用 buildx 构建并推送到自己的 registry
# （本项目不发布官方镜像）。
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck 全量
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -x *.sh lib/*.sh scripts/*.sh

      - name: 打源码快照
        run: |
          NAME="rea-ghidra-setup-${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="${NAME}/" -o "${NAME}.tar.gz" HEAD
          echo "ASSET=${NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: 生成 Release 资产校验和（checksums.txt）
        run: |
          NAME="rea-ghidra-setup-${GITHUB_REF_NAME}"
          sha256sum "${NAME}.tar.gz" > "${NAME}.checksums.txt"
          echo "CHECKSUMS=${NAME}.checksums.txt" >> "$GITHUB_ENV"
          cat "${NAME}.checksums.txt"

      - name: 生成 SBOM（SPDX JSON，Syft；失败不阻断发布）
        id: sbom
        continue-on-error: true
        uses: anchore/sbom-action@v0.17.4
        with:
          format: spdx-json
          path: .
          # 关键：两个上传开关默认都是 true，会忽略 output-file 并把 SBOM 写到临时目录，
          # 导致后续 softprops 找不到文件。这里显式关闭，让产物落到工作区的 output-file。
          upload-artifact: false
          upload-release-assets: false
          output-file: "${{ github.workspace }}/rea-ghidra-setup-${{ github.ref_name }}.spdx.json"
      - name: SBOM 兜底（确保产物存在且合法；syft 失败或文件缺失时写最小 SPDX 2.3）
        run: |
          NAME="rea-ghidra-setup-${GITHUB_REF_NAME}"
          if [ ! -s "${NAME}.spdx.json" ]; then
            echo ">> 未取得 syft SBOM，写入最小 SPDX 2.3 兜底"
            cat > "${NAME}.spdx.json" <<JSON
          {
            "spdxVersion": "SPDX-2.3",
            "dataLicense": "CC0-1.0",
            "SPDXID": "SPDXRef-DOCUMENT",
            "name": "${NAME}",
            "documentNamespace": "${{ github.server_url }}/${{ github.repository }}/sbom/${GITHUB_REF_NAME}",
            "creationInfo": {
              "created": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "creators": ["Tool: rea-ghidra-setup-release"]
            },
            "documentDescribes": [],
            "packages": []
          }
          JSON
          fi
          python3 -c "import json,sys;json.load(open('${NAME}.spdx.json'));print('>> SBOM 合法 JSON')"
          echo "SBOM=${NAME}.spdx.json" >> "$GITHUB_ENV"

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          overwrite_files: true
          files: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUMS }}
            ${{ env.SBOM }}
