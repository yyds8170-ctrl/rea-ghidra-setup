name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # 每周一 03:20 UTC 跑一次完整端到端回归
    - cron: '20 3 * * 1'
  workflow_dispatch:

jobs:
  # 轻量检查：每次 push / PR 都跑
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: sudo apt-get update && sudo apt-get install -y shellcheck make gcc

      - name: ShellCheck（全部 bash 脚本）
        run: |
          shopt -s globstar nullglob
          shellcheck -x *.sh lib/*.sh scripts/*.sh

      - name: 版本一致性检查
        run: bash scripts/check-versions.sh

      - name: 编译 demo
        run: make -C examples

  # 完整端到端：仅在每周计划任务或手动触发时运行（含 JDK + Ghidra 下载）
  e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22（REA 要求 >=22.19）
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 缓存 JDK + Ghidra
        uses: actions/cache@v4
        with:
          path: ~/tools
          key: ${{ runner.os }}-ghidra-12.1.4-jdk21-v2

      - name: 一键部署 JDK + Ghidra
        run: bash install.sh

      - name: 端到端验证
        run: bash verify.sh

  # macOS 端到端（macos-latest = Apple Silicon arm64，需构建 mac_arm_64 native）
  # 仅每周/手动触发；Intel 可用 macos-13 自行验证（见 docs/platform-macos.md）
  e2e-macos:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22（REA 要求 >=22.19）
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 缓存 JDK + Ghidra
        uses: actions/cache@v4
        with:
          path: ~/tools
          key: ${{ runner.os }}-ghidra-12.1.4-jdk21-v2

      - name: 一键部署（JDK + Ghidra + native 构建）
        run: bash install-macos.sh

      - name: 端到端验证（Mach-O）
        run: bash verify-macos.sh

  # 容器镜像构建 + 容器内端到端验证（每周/手动）
  docker:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像并加载到本地
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rea-ghidra:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 容器内运行 verify.sh
        run: docker run --rm --entrypoint bash rea-ghidra:ci /opt/rea-ghidra-setup/verify.sh
