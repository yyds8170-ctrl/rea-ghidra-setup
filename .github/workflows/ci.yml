name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # 每周一 03:20 UTC 跑一次完整端到端回归
    - cron: '20 3 * * 1'
  workflow_dispatch:

jobs:
  # 轻量检查：每次 push / PR 都跑
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: sudo apt-get update && sudo apt-get install -y shellcheck make gcc

      - name: ShellCheck（全部 bash 脚本）
        run: |
          shopt -s globstar nullglob
          shellcheck -x *.sh lib/*.sh scripts/*.sh

      - name: 文档死链检查
        run: bash scripts/check-docs-links.sh

      - name: bash3.2 兼容（macOS：禁止 $变量 紧跟非 ASCII 字节）
        run: |
          # macOS 自带 bash 3.2 在 set -u 下会把全角中文标点的字节误并入变量名，
          # 例如 "$ver）" 会被当成未定义变量。统一要求用 ${var} 显式界定。
          if LC_ALL=C grep -rnP '\$[A-Za-z_][A-Za-z0-9_]*[\x80-\xff]' *.sh lib/*.sh scripts/*.sh; then
            echo "::error::发现 \$变量 后紧跟非 ASCII 字节（macOS bash 3.2 会误判变量名），请改写为 \${var}"
            exit 1
          fi
          echo "bash3.2 非 ASCII 紧邻检查通过"

      - name: 版本一致性检查
        run: bash scripts/check-versions.sh

      - name: CLI 参数自检（--help/--dry-run/未知参数/覆盖生效）
        run: |
          set -e
          # --help 退出 0 且含用法
          bash install.sh --help | grep -q -- '--dry-run'
          bash install-macos.sh --help | grep -q -- '--dry-run'
          # --dry-run 退出 0 且打印关键配置字段（Linux 安装器）
          bash install.sh --dry-run | tee /tmp/dry.txt
          grep -q '平台/环境' /tmp/dry.txt
          grep -q '镜像模式' /tmp/dry.txt
          grep -q 'Ghidra 12.1.4' /tmp/dry.txt
          # install-macos.sh 在 ubuntu 上 dry-run 也必须提前退出、不触碰 Darwin 专属命令
          bash install-macos.sh --dry-run | grep -q '平台/环境'
          # 未知参数退出码 2
          set +e; bash install.sh --no-such-flag >/dev/null 2>&1; rc=$?; set -e
          [ "$rc" -eq 2 ] || { echo "未知参数应退出 2，实际 $rc"; exit 1; }
          # 覆盖生效：--prefix/--mirror/--rea-version 的值要出现在 dry-run 输出里
          bash install.sh --dry-run --prefix /tmp/x --mirror cn --rea-version 9.9.9 | tee /tmp/dry2.txt
          grep -q '/tmp/x' /tmp/dry2.txt
          grep -q '有效 = cn' /tmp/dry2.txt
          grep -q 'REA 9.9.9' /tmp/dry2.txt
          echo "CLI 参数自检通过"

      - name: MCP 对接脚本自检（--list/--dry-run/握手）
        env:
          REA_MIRROR: global
        run: |
          set -e
          bash scripts/mcp-setup.sh --list | tee /tmp/mcp_list.txt
          grep -q 'claude-desktop' /tmp/mcp_list.txt
          bash scripts/mcp-setup.sh --dry-run --client claude-desktop | tee /tmp/mcp_dry.txt
          grep -q '"command"' /tmp/mcp_dry.txt
          grep -q -- '--mcp' /tmp/mcp_dry.txt
          # lint 环境无 Ghidra：只要求原生 stdio 握手 a 通过（doctor b 会优雅跳过）
          bash scripts/mcp-setup.sh --check
          echo "MCP 脚本自检通过"

      - name: 编译 demo
        run: make -C examples

      - name: 编译端到端案例库（5 案例，含 strip 版构建）
        run: make -C examples/cases all

      - name: 退出码与 JSON 错误断言
        run: |
          set -e
          # 未知参数 → RC_USAGE=2，且 stderr 含机器可读 JSON envelope。
          # 注意 set -e 下须用 `|| rc=$?` 捕获预期失败的退出码（`cmd; rc=$?` 会被 set -e 直接中止）。
          rc=0
          bash install.sh --no-such-flag >/dev/null 2>/tmp/e1.txt || rc=$?
          [ "$rc" -eq 2 ] || { echo "未知参数应退出 2，实际 $rc"; exit 1; }
          python3 - /tmp/e1.txt <<'PY'
          import json, sys
          lines = [l for l in open(sys.argv[1], encoding='utf-8') if l.strip().startswith('{')]
          assert lines, 'stderr 缺少 JSON envelope 行'
          env = json.loads(lines[-1])
          e = env['error']
          assert e['code'] == 2 and e['name'] == 'RC_USAGE', e
          print('JSON envelope OK:', e)
          PY
          # ghidra-export 无目标 → 2
          rc=0
          bash scripts/ghidra-export.sh >/dev/null 2>&1 || rc=$?
          [ "$rc" -eq 2 ] || { echo "ghidra-export 无目标应退出 2，实际 $rc"; exit 1; }
          # 缺 Ghidra/JDK → 10（runner 若注入 JAVA_HOME=JDK17，jdk_major 17<21 仍走未找到 JDK21）
          rc=0
          TOOLS_DIR=/nonexistent GHIDRA_INSTALL_DIR= JAVA_HOME= bash scripts/ghidra-export.sh examples/demo >/dev/null 2>/tmp/e3.txt || rc=$?
          [ "$rc" -eq 10 ] || { echo "缺 Ghidra/JDK 应退出 10，实际 $rc"; exit 1; }
          # batch-analyze 取值参数缺值 → RC_USAGE=2（v4.1 守卫补齐）
          rc=0
          bash scripts/batch-analyze.sh --snapshot >/dev/null 2>&1 || rc=$?
          [ "$rc" -eq 2 ] || { echo "batch-analyze --snapshot 缺值应退出 2，实际 $rc"; exit 1; }
          rc=0
          bash scripts/batch-analyze.sh --jobs >/dev/null 2>&1 || rc=$?
          [ "$rc" -eq 2 ] || { echo "batch-analyze --jobs 缺值应退出 2，实际 $rc"; exit 1; }
          echo "退出码与 JSON 错误断言通过"

  # PowerShell 静态检查：每次 push / PR 都跑（ubuntu 上的 pwsh 即可解析 .ps1）
  lint-ps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop

      - name: 语法解析（不依赖规则的兜底）
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter *.ps1
          $parseErrors = 0
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Output "语法错误：$($f.FullName)"
              $errors | ForEach-Object { Write-Output "  $_" }
              $parseErrors++
            }
          }
          if ($parseErrors -gt 0) { exit 1 }
          Write-Output "PowerShell 语法解析通过（$($files.Count) 个文件）"

      - name: PSScriptAnalyzer（Error 判失败；Warning 仅提示）
        shell: pwsh
        run: |
          # 注意：-IncludeRule 是“按规则名过滤”，不能传文件通配符（此前 -IncludeRule *.ps1 为空跑）。
          $all = Invoke-ScriptAnalyzer -Path . -Recurse
          $errs = $all | Where-Object { $_.Severity -eq 'Error' }
          $warns = $all | Where-Object { $_.Severity -eq 'Warning' }
          Write-Output ("PSScriptAnalyzer Warning 数（不阻断）：" + @($warns).Count)
          if ($errs) {
            $errs | Format-Table -AutoSize ScriptName,Line,Severity,RuleName,Message
            throw "PSScriptAnalyzer 发现 $($errs.Count) 个 Error"
          }
          Write-Output 'PSScriptAnalyzer：无 Error'

      - name: install.ps1 CLI 自检（-Help/-DryRun 提前退出，不触碰 Windows 专属动作）
        shell: pwsh
        run: |
          # -Help / -DryRun 退出 0 且打印预期字段
          pwsh -File ./install.ps1 -Help | Out-File /tmp/pshelp.txt
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 -Help 退出码 $LASTEXITCODE" }
          if (-not (Select-String -Path /tmp/pshelp.txt -Quiet -SimpleMatch '-DryRun')) { throw '帮助未列出 -DryRun' }
          pwsh -File ./install.ps1 -DryRun | Tee-Object /tmp/psdry.txt
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 -DryRun 退出码 $LASTEXITCODE" }
          foreach ($need in @('平台/环境','镜像模式','组件版本','安装目录')) {
            if (-not (Select-String -Path /tmp/psdry.txt -Quiet -SimpleMatch $need)) { throw "dry-run 缺少字段：$need" }
          }
          # uninstall.ps1 -Help 退出 0
          pwsh -File ./uninstall.ps1 -Help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "uninstall.ps1 -Help 退出码 $LASTEXITCODE" }
          # 未知参数应非 0（且不得执行安装体）；加 [CmdletBinding()] 后会被参数绑定拦截
          pwsh -File ./install.ps1 -NoSuchFlag 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'install.ps1 未知参数应非 0 退出' }
          # 上面“预期非零”的退出码不能泄漏给 GitHub Actions 的 pwsh 包装器，否则步骤会被误判失败
          $global:LASTEXITCODE = 0
          Write-Output 'PowerShell CLI 自检通过'

      - name: mcp-setup.ps1 自检（-List/-DryRun，不写盘）
        shell: pwsh
        run: |
          pwsh -File ./scripts/mcp-setup.ps1 -List | Tee-Object /tmp/mcp_ps_list.txt
          if ($LASTEXITCODE -ne 0) { throw "mcp-setup.ps1 -List 退出码 $LASTEXITCODE" }
          if (-not (Select-String -Path /tmp/mcp_ps_list.txt -Quiet -SimpleMatch 'claude-desktop')) { throw 'list 未列出 claude-desktop' }
          pwsh -File ./scripts/mcp-setup.ps1 -DryRun -Client claude-desktop | Tee-Object /tmp/mcp_ps_dry.txt
          if ($LASTEXITCODE -ne 0) { throw "mcp-setup.ps1 -DryRun 退出码 $LASTEXITCODE" }
          if (-not (Select-String -Path /tmp/mcp_ps_dry.txt -Quiet -SimpleMatch '--mcp')) { throw 'dry-run 未含 --mcp' }
          Write-Output 'mcp-setup.ps1 自检通过'
          exit 0

  # 跨平台完整端到端：Linux / macOS(arm64) / Windows(x64)
  # 仅每周计划或手动触发（含 JDK + Ghidra 下载 / macOS native 构建）；缓存命中后约 4-6 分钟
  e2e:
    name: e2e (${{ matrix.label }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            os: ubuntu-latest
            install: bash install.sh
            verify: bash verify.sh
            cache-path: ~/tools
            cache-key: Linux-ghidra-12.1.4-jdk21-v2
          - label: macos
            os: macos-latest          # = Apple Silicon arm64，需构建 mac_arm_64 native
            install: bash install-macos.sh
            verify: bash verify-macos.sh
            cache-path: ~/tools
            cache-key: macOS-ghidra-12.1.4-jdk21-v2
          - label: windows
            os: windows-latest        # = x64，用户态 zip + PowerShell；用仓库自带 PE fixture
            install: .\install.ps1
            verify: .\verify.ps1
            cache-path: C:\Users\runneradmin\tools
            cache-key: Windows-ghidra-12.1.4-jdk21-v1
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22（REA 要求 >=22.19）
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 缓存 JDK + Ghidra（按平台独立 key）
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache-path }}
          key: ${{ matrix.cache-key }}

      - name: 一键部署（Linux / macOS）
        if: matrix.label != 'windows'
        shell: bash
        run: ${{ matrix.install }}

      - name: 一键部署（Windows）
        if: matrix.label == 'windows'
        shell: pwsh
        run: ${{ matrix.install }}

      - name: 安装后自检 doctor（Linux / macOS）
        if: matrix.label != 'windows'
        shell: bash
        run: bash scripts/doctor.sh

      - name: 安装后自检 doctor（Windows）
        if: matrix.label == 'windows'
        shell: pwsh
        run: .\scripts\doctor.ps1

      - name: 端到端验证（Linux / macOS）
        if: matrix.label != 'windows'
        shell: bash
        run: ${{ matrix.verify }}

      - name: 端到端验证（Windows）
        if: matrix.label == 'windows'
        shell: pwsh
        run: ${{ matrix.verify }}

      - name: MCP 连接自检 + 临时 HOME 真实注册（Linux / macOS）
        if: matrix.label != 'windows'
        shell: bash
        run: |
          set -e
          # 握手 a + Ghidra provider b（e2e 已装 Ghidra/JDK）
          bash scripts/mcp-setup.sh --check
          # 用临时 HOME 对 claude-desktop 真实写 JSON，断言解析后含 rea 绝对命令，不污染 runner 配置
          THOME="$(mktemp -d)"
          HOME="$THOME" bash scripts/mcp-setup.sh --client claude-desktop --yes
          # macOS 与 Linux 的 claude-desktop 配置路径不同
          case "$(uname -s)" in
            Darwin) REL="Library/Application Support/Claude/claude_desktop_config.json" ;;
            *)      REL=".config/Claude/claude_desktop_config.json" ;;
          esac
          python3 -c "import json,os,sys; p=os.path.join(sys.argv[1],sys.argv[2]); d=json.load(open(p)); assert d['mcpServers']['rea']['args'][-1]=='--mcp'; print('e2e MCP 注册 JSON 校验通过：', d['mcpServers']['rea']['command'])" "$THOME" "$REL"

      - name: MCP 连接自检 + 临时 HOME 真实注册（Windows）
        if: matrix.label == 'windows'
        shell: pwsh
        run: |
          pwsh -File ./scripts/mcp-setup.ps1 -Check
          $th = Join-Path $env:TEMP ("mcp-home-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $th | Out-Null
          # claude-desktop/cursor 真实路径取 %APPDATA%（子进程会继承）；重定向到临时目录避免污染 runner
          $env:APPDATA = $th
          $env:USERPROFILE = $th
          pwsh -File ./scripts/mcp-setup.ps1 -Client claude-desktop -Yes
          $cfg = Join-Path $th 'Claude\claude_desktop_config.json'
          $d = Get-Content -Raw $cfg | ConvertFrom-Json
          if ($d.mcpServers.rea.args[-1] -ne '--mcp') { throw '注册 JSON 缺少 --mcp' }
          Write-Output "e2e MCP 注册 JSON 校验通过：$($d.mcpServers.rea.command)"

      - name: 统一入口自检（Linux / macOS）
        if: matrix.label != 'windows'
        shell: bash
        run: |
          set -e
          ./rea-ghidra --help >/dev/null
          # 版本号断言：入口 version --raw 必须与 VERSION 文件一致（不逐版本硬编码）
          got="$(./rea-ghidra version --raw)"
          [ "$got" = "$(cat VERSION)" ] || { echo "入口版本不符：$got vs $(cat VERSION)"; exit 1; }
          ./rea-ghidra doctor >/dev/null
          ./rea-ghidra current
          ./rea-ghidra self-update --check
      - name: 统一入口 MCP/导出自检（Linux）
        if: matrix.label == 'linux'
        shell: bash
        run: |
          set -e
          ./rea-ghidra mcp --check
          ./rea-ghidra export ./examples/demo --out /tmp/entry-out --kind functions

      - name: 统一入口自检（Windows）
        if: matrix.label == 'windows'
        shell: pwsh
        run: |
          .\rea-ghidra.ps1 --help | Out-Null
          # 版本号断言：入口 version --raw 必须与 VERSION 文件一致（不逐版本硬编码；不依赖 Write-Host 宿主流）
          $v = (.\rea-ghidra.ps1 version --raw)
          $exp = (Get-Content VERSION -Raw).Trim()
          if ("$v" -ne $exp) { throw "入口版本不符：$v vs $exp" }
          .\rea-ghidra.ps1 doctor | Out-Null
          .\rea-ghidra.ps1 self-update --check
          exit 0

      - name: Ghidra 静态导出回归（Linux / macOS，analyzeHeadless 较慢）
        if: matrix.label != 'windows'
        shell: bash
        run: bash scripts/selftest-export.sh

      - name: 批量并行 + 快照缓存回归（仅 Linux，控时不每平台跑）
        if: matrix.label == 'linux'
        shell: bash
        run: bash scripts/selftest-batch.sh

      - name: 端到端案例库断言（仅 Linux：5 案例 × 带符号/strip，共 10 二进制）
        if: matrix.label == 'linux'
        shell: bash
        run: bash scripts/run-cases.sh

      - name: 报告生成器断言（仅 Linux：生成 md+html+JSON 并校验关键常量）
        if: matrix.label == 'linux'
        shell: bash
        run: |
          set -e
          REPORT_OUT="$(mktemp -d)"
          # 案例库已编译的 01 crackme 作为真实目标
          bash scripts/ghidra-report.sh examples/cases/build/01-crackme-password \
            --out "$REPORT_OUT" --format both
          test -s "$REPORT_OUT/report.md"
          test -s "$REPORT_OUT/report.html"
          test -s "$REPORT_OUT/constants.json"
          python3 -c 'import json,sys,os; d=sys.argv[1]; vals="\n".join(s.get("value","") for s in json.load(open(os.path.join(d,"strings.json")))); assert "S3cr3t-2026" in vals and "ACCESS GRANTED" in vals, "报告缺少关键字符串"; print("报告生成器断言通过：md/html/JSON 齐全，关键字符串命中")' "$REPORT_OUT"

      - name: 端到端案例库断言（macOS：同样真实跑，验证跨平台 Ghidra 行为）
        if: matrix.label == 'macos'
        shell: bash
        run: bash scripts/run-cases.sh

      - name: Ghidra 静态导出回归（Windows，PE fixture，只跑 functions）
        if: matrix.label == 'windows'
        shell: pwsh
        run: |
          $out = Join-Path $env:TEMP ("rea-exp-" + [guid]::NewGuid().ToString('N'))
          pwsh -File ./scripts/ghidra-export.ps1 -Bin ./examples/bin/windows-x64/demo.exe -Out $out -Kind functions
          $f = Join-Path $out 'functions.json'
          if (-not (Test-Path $f)) { throw '未生成 functions.json' }
          $j = Get-Content -Raw $f | ConvertFrom-Json
          if (@($j).Count -lt 1) { throw 'functions.json 为空' }
          Write-Output ("e2e Windows 导出通过：functions=" + @($j).Count)

  # 容器镜像构建 + 容器内端到端验证（每周/手动）
  docker:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像并加载到本地
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rea-ghidra:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 容器内运行 verify.sh
        run: docker run --rm --entrypoint bash rea-ghidra:ci /opt/rea-ghidra-setup/verify.sh

  # 容器镜像（linux/arm64）：用原生 arm64 runner，避免 QEMU 模拟编译 native 的极慢过程
  # 该 runner 为 Public preview；仅每周/手动触发
  docker-arm64:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 原生构建 arm64 镜像（内含 linux_arm_64 native 编译）
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rea-ghidra:arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 容器内运行 verify.sh（arm64）
        run: docker run --rm --entrypoint bash rea-ghidra:arm64 /opt/rea-ghidra-setup/verify.sh

  # 校验和链路：确认三类上游校验和源可取、真实下载 Node 并强校验
  checksum:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 校验和链路自检
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/selfcheck-checksums.sh

  # 多架构 fixture 回归：交叉编译 ELF32/AArch64 ELF/PE32，Ghidra 跨架构导入并识别预期架构
  fixture-multiarch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22（REA 要求 >=22.19）
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 缓存 JDK + Ghidra
        uses: actions/cache@v4
        with:
          path: ~/tools
          key: Linux-ghidra-12.1.4-jdk21-v2

      - name: 一键部署（装 JDK21+Ghidra）
        run: bash install.sh

      - name: 安装交叉工具链
        run: |
          sudo apt-get update -qq
          # 用三个跨目标交叉编译器（i686/aarch64/mingw），避免 gcc-multilib 与原生 gcc 版本冲突
          sudo apt-get install -y -qq gcc-i686-linux-gnu gcc-aarch64-linux-gnu gcc-mingw-w64-i686 file

      - name: 编译多架构 fixture
        run: bash scripts/build-fixtures.sh

      - name: Ghidra 导入 ELF32 并断言 x86:LE:32
        run: |
          OUT="$(mktemp -d)"
          scripts/ghidra-export.sh examples/fixtures/elf32 --out "$OUT" --kind functions 2>&1 | tee /tmp/elf32.log
          grep -q "x86:LE:32" /tmp/elf32.log || { echo "未识别为 x86:LE:32"; exit 1; }
          test -s "$OUT/functions.json"

      - name: Ghidra 导入 AArch64 并断言 AARCH64:LE:64
        run: |
          OUT="$(mktemp -d)"
          scripts/ghidra-export.sh examples/fixtures/aarch64 --out "$OUT" --kind functions 2>&1 | tee /tmp/a64.log
          grep -q "AARCH64:LE:64" /tmp/a64.log || { echo "未识别为 AARCH64:LE:64"; exit 1; }
          test -s "$OUT/functions.json"

      - name: Ghidra 导入 PE32 并断言导入成功
        run: |
          OUT="$(mktemp -d)"
          scripts/ghidra-export.sh examples/fixtures/pe32.exe --out "$OUT" --kind functions 2>&1 | tee /tmp/pe.log
          test -s "$OUT/functions.json" || { echo "PE32 导出为空"; exit 1; }
