name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # 每周一 03:20 UTC 跑一次完整端到端回归
    - cron: '20 3 * * 1'
  workflow_dispatch:

jobs:
  # 轻量检查：每次 push / PR 都跑
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: sudo apt-get update && sudo apt-get install -y shellcheck make gcc

      - name: ShellCheck（全部 bash 脚本）
        run: |
          shopt -s globstar nullglob
          shellcheck -x *.sh lib/*.sh scripts/*.sh

      - name: 版本一致性检查
        run: bash scripts/check-versions.sh

      - name: CLI 参数自检（--help/--dry-run/未知参数/覆盖生效）
        run: |
          set -e
          # --help 退出 0 且含用法
          bash install.sh --help | grep -q -- '--dry-run'
          bash install-macos.sh --help | grep -q -- '--dry-run'
          # --dry-run 退出 0 且打印关键配置字段（Linux 安装器）
          bash install.sh --dry-run | tee /tmp/dry.txt
          grep -q '平台/环境' /tmp/dry.txt
          grep -q '镜像模式' /tmp/dry.txt
          grep -q 'Ghidra 12.1.4' /tmp/dry.txt
          # install-macos.sh 在 ubuntu 上 dry-run 也必须提前退出、不触碰 Darwin 专属命令
          bash install-macos.sh --dry-run | grep -q '平台/环境'
          # 未知参数退出码 2
          set +e; bash install.sh --no-such-flag >/dev/null 2>&1; rc=$?; set -e
          [ "$rc" -eq 2 ] || { echo "未知参数应退出 2，实际 $rc"; exit 1; }
          # 覆盖生效：--prefix/--mirror/--rea-version 的值要出现在 dry-run 输出里
          bash install.sh --dry-run --prefix /tmp/x --mirror cn --rea-version 9.9.9 | tee /tmp/dry2.txt
          grep -q '/tmp/x' /tmp/dry2.txt
          grep -q '有效 = cn' /tmp/dry2.txt
          grep -q 'REA 9.9.9' /tmp/dry2.txt
          echo "CLI 参数自检通过"

      - name: 编译 demo
        run: make -C examples

  # PowerShell 静态检查：每次 push / PR 都跑（ubuntu 上的 pwsh 即可解析 .ps1）
  lint-ps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop

      - name: 语法解析（不依赖规则的兜底）
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter *.ps1
          $parseErrors = 0
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Output "语法错误：$($f.FullName)"
              $errors | ForEach-Object { Write-Output "  $_" }
              $parseErrors++
            }
          }
          if ($parseErrors -gt 0) { exit 1 }
          Write-Output "PowerShell 语法解析通过（$($files.Count) 个文件）"

      - name: PSScriptAnalyzer（Error + Warning 均判失败）
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -IncludeRule *.ps1
          $issues = $issues | Where-Object { $_.Path -like '*.ps1' -and $_.Severity -in @('Error','Warning') }
          if ($issues) {
            $issues | Format-Table -AutoSize
            throw "PSScriptAnalyzer 发现 $($issues.Count) 个 Error/Warning"
          }
          Write-Output 'PSScriptAnalyzer：无 Error/Warning'

      - name: install.ps1 CLI 自检（-Help/-DryRun 提前退出，不触碰 Windows 专属动作）
        shell: pwsh
        run: |
          # -Help / -DryRun 退出 0 且打印预期字段
          pwsh -File ./install.ps1 -Help | Out-File /tmp/pshelp.txt
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 -Help 退出码 $LASTEXITCODE" }
          if (-not (Select-String -Path /tmp/pshelp.txt -Quiet -SimpleMatch '-DryRun')) { throw '帮助未列出 -DryRun' }
          pwsh -File ./install.ps1 -DryRun | Tee-Object /tmp/psdry.txt
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 -DryRun 退出码 $LASTEXITCODE" }
          foreach ($need in @('平台/环境','镜像模式','组件版本','安装目录')) {
            if (-not (Select-String -Path /tmp/psdry.txt -Quiet -SimpleMatch $need)) { throw "dry-run 缺少字段：$need" }
          }
          # uninstall.ps1 -Help 退出 0
          pwsh -File ./uninstall.ps1 -Help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "uninstall.ps1 -Help 退出码 $LASTEXITCODE" }
          # 未知参数应非 0（且不得执行安装体）；加 [CmdletBinding()] 后会被参数绑定拦截
          pwsh -File ./install.ps1 -NoSuchFlag 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'install.ps1 未知参数应非 0 退出' }
          # 上面“预期非零”的退出码不能泄漏给 GitHub Actions 的 pwsh 包装器，否则步骤会被误判失败
          $global:LASTEXITCODE = 0
          Write-Output 'PowerShell CLI 自检通过'
          exit 0

  # 跨平台完整端到端：Linux / macOS(arm64) / Windows(x64)
  # 仅每周计划或手动触发（含 JDK + Ghidra 下载 / macOS native 构建）；缓存命中后约 4-6 分钟
  e2e:
    name: e2e (${{ matrix.label }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            os: ubuntu-latest
            install: bash install.sh
            verify: bash verify.sh
            cache-path: ~/tools
            cache-key: Linux-ghidra-12.1.4-jdk21-v2
          - label: macos
            os: macos-latest          # = Apple Silicon arm64，需构建 mac_arm_64 native
            install: bash install-macos.sh
            verify: bash verify-macos.sh
            cache-path: ~/tools
            cache-key: macOS-ghidra-12.1.4-jdk21-v2
          - label: windows
            os: windows-latest        # = x64，用户态 zip + PowerShell；用仓库自带 PE fixture
            install: .\install.ps1
            verify: .\verify.ps1
            cache-path: C:\Users\runneradmin\tools
            cache-key: Windows-ghidra-12.1.4-jdk21-v1
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22（REA 要求 >=22.19）
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 缓存 JDK + Ghidra（按平台独立 key）
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache-path }}
          key: ${{ matrix.cache-key }}

      - name: 一键部署（Linux / macOS）
        if: matrix.label != 'windows'
        shell: bash
        run: ${{ matrix.install }}

      - name: 一键部署（Windows）
        if: matrix.label == 'windows'
        shell: pwsh
        run: ${{ matrix.install }}

      - name: 安装后自检 doctor（Linux / macOS）
        if: matrix.label != 'windows'
        shell: bash
        run: bash scripts/doctor.sh

      - name: 安装后自检 doctor（Windows）
        if: matrix.label == 'windows'
        shell: pwsh
        run: .\scripts\doctor.ps1

      - name: 端到端验证（Linux / macOS）
        if: matrix.label != 'windows'
        shell: bash
        run: ${{ matrix.verify }}

      - name: 端到端验证（Windows）
        if: matrix.label == 'windows'
        shell: pwsh
        run: ${{ matrix.verify }}

  # 容器镜像构建 + 容器内端到端验证（每周/手动）
  docker:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像并加载到本地
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rea-ghidra:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 容器内运行 verify.sh
        run: docker run --rm --entrypoint bash rea-ghidra:ci /opt/rea-ghidra-setup/verify.sh

  # 容器镜像（linux/arm64）：用原生 arm64 runner，避免 QEMU 模拟编译 native 的极慢过程
  # 该 runner 为 Public preview；仅每周/手动触发
  docker-arm64:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 原生构建 arm64 镜像（内含 linux_arm_64 native 编译）
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rea-ghidra:arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 容器内运行 verify.sh（arm64）
        run: docker run --rm --entrypoint bash rea-ghidra:arm64 /opt/rea-ghidra-setup/verify.sh

  # 校验和链路：确认三类上游校验和源可取、真实下载 Node 并强校验
  checksum:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 校验和链路自检
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/selfcheck-checksums.sh
