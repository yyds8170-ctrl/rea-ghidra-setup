name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # 每周一 03:20 UTC 跑一次完整端到端回归
    - cron: '20 3 * * 1'
  workflow_dispatch:

jobs:
  # 轻量检查：每次 push / PR 都跑
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: sudo apt-get update && sudo apt-get install -y shellcheck make gcc

      - name: ShellCheck（全部 bash 脚本）
        run: |
          shopt -s globstar nullglob
          shellcheck -x *.sh lib/*.sh scripts/*.sh

      - name: 版本一致性检查
        run: bash scripts/check-versions.sh

      - name: 编译 demo
        run: make -C examples

  # PowerShell 静态检查：每次 push / PR 都跑（ubuntu 上的 pwsh 即可解析 .ps1）
  lint-ps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop

      - name: 语法解析（不依赖规则的兜底）
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter *.ps1
          $parseErrors = 0
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Output "语法错误：$($f.FullName)"
              $errors | ForEach-Object { Write-Output "  $_" }
              $parseErrors++
            }
          }
          if ($parseErrors -gt 0) { exit 1 }
          Write-Output "PowerShell 语法解析通过（$($files.Count) 个文件）"

      - name: PSScriptAnalyzer（Error + Warning 均判失败）
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -IncludeRule *.ps1
          $issues = $issues | Where-Object { $_.Path -like '*.ps1' -and $_.Severity -in @('Error','Warning') }
          if ($issues) {
            $issues | Format-Table -AutoSize
            throw "PSScriptAnalyzer 发现 $($issues.Count) 个 Error/Warning"
          }
          Write-Output 'PSScriptAnalyzer：无 Error/Warning'

  # 跨平台完整端到端：Linux / macOS(arm64) / Windows(x64)
  # 仅每周计划或手动触发（含 JDK + Ghidra 下载 / macOS native 构建）；缓存命中后约 4-6 分钟
  e2e:
    name: e2e (${{ matrix.label }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            os: ubuntu-latest
            install: bash install.sh
            verify: bash verify.sh
            cache-path: ~/tools
            cache-key: Linux-ghidra-12.1.4-jdk21-v2
          - label: macos
            os: macos-latest          # = Apple Silicon arm64，需构建 mac_arm_64 native
            install: bash install-macos.sh
            verify: bash verify-macos.sh
            cache-path: ~/tools
            cache-key: macOS-ghidra-12.1.4-jdk21-v2
          - label: windows
            os: windows-latest        # = x64，用户态 zip + PowerShell；用仓库自带 PE fixture
            install: .\install.ps1
            verify: .\verify.ps1
            cache-path: C:\Users\runneradmin\tools
            cache-key: Windows-ghidra-12.1.4-jdk21-v1
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22（REA 要求 >=22.19）
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 缓存 JDK + Ghidra（按平台独立 key）
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache-path }}
          key: ${{ matrix.cache-key }}

      - name: 一键部署（Linux / macOS）
        if: matrix.label != 'windows'
        shell: bash
        run: ${{ matrix.install }}

      - name: 一键部署（Windows）
        if: matrix.label == 'windows'
        shell: pwsh
        run: ${{ matrix.install }}

      - name: 端到端验证（Linux / macOS）
        if: matrix.label != 'windows'
        shell: bash
        run: ${{ matrix.verify }}

      - name: 端到端验证（Windows）
        if: matrix.label == 'windows'
        shell: pwsh
        run: ${{ matrix.verify }}

  # 容器镜像构建 + 容器内端到端验证（每周/手动）
  docker:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 构建镜像并加载到本地
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rea-ghidra:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 容器内运行 verify.sh
        run: docker run --rm --entrypoint bash rea-ghidra:ci /opt/rea-ghidra-setup/verify.sh

  # 容器镜像（linux/arm64）：用原生 arm64 runner，避免 QEMU 模拟编译 native 的极慢过程
  # 该 runner 为 Public preview；仅每周/手动触发
  docker-arm64:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 原生构建 arm64 镜像（内含 linux_arm_64 native 编译）
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rea-ghidra:arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 容器内运行 verify.sh（arm64）
        run: docker run --rm --entrypoint bash rea-ghidra:arm64 /opt/rea-ghidra-setup/verify.sh
