name: DIAG Windows
# 临时诊断工作流：仅手动触发，定位 Windows Ghidra headless 回归。定位后删除。
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 恢复与 e2e 相同的工具缓存
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\tools
          key: Windows-ghidra-12.1.4-jdk21-v1
          restore-keys: |
            Windows-ghidra-12.1.4-jdk21-v1-

      - name: 一键部署（幂等，复用缓存）
        shell: pwsh
        continue-on-error: true
        run: .\install.ps1

      - name: 目录结构与链接清单
        shell: pwsh
        continue-on-error: true
        run: |
          $real = 'C:\Users\runneradmin\tools\ghidra_12.1.4_PUBLIC'
          Write-Output "=== real Ghidra top level ==="
          Get-ChildItem $real | Select-Object Name, Mode
          Write-Output "=== Test-Path checks (PowerShell) ==="
          Write-Output ("real\Ghidra exists: " + (Test-Path "$real\Ghidra"))
          Write-Output ("link\Ghidra exists: " + (Test-Path 'C:\users\runneradmin\tools\current-ghidra\Ghidra'))
          Write-Output "=== link inventory ==="
          Get-ChildItem C:\Users\runneradmin\tools | Select-Object Name, LinkType, Target

      - name: cmd if-exist 矩阵（真实路径 vs 符号链接）
        shell: cmd
        continue-on-error: true
        run: |
          if exist "C:\Users\runneradmin\tools\ghidra_12.1.4_PUBLIC\Ghidra" echo YES_REAL_GHIDRA
          if exist "C:\Users\runneradmin\tools\current-ghidra\Ghidra" echo YES_LINK_GHIDRA
          dir "C:\Users\runneradmin\tools\current-ghidra"
          fsutil behavior query SymlinkEvaluation

      - name: Headless 走真实路径（不经过符号链接）
        shell: pwsh
        continue-on-error: true
        run: |
          $real = 'C:\Users\runneradmin\tools\ghidra_12.1.4_PUBLIC'
          $work = Join-Path $env:TEMP ('real-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $fixture = Join-Path $work 'demo.exe'
          Copy-Item .\examples\bin\windows-x64\demo.exe $fixture -Force
          $log = Join-Path $work 'ghidra'
          & "$real\support\analyzeHeadless.bat" (Join-Path $work 'proj') p -import $fixture -log $log
          Write-Output "REAL HEADLESS EXIT=$LASTEXITCODE"
          if (Test-Path "$log.log") { Get-Content "$log.log" -Tail 40 }

      - name: 重建为 Junction 后再走链接
        shell: pwsh
        continue-on-error: true
        run: |
          $tools = 'C:\Users\runneradmin\tools'
          cmd /c rmdir "$tools\current-ghidra"
          cmd /c mklink /J "$tools\current-ghidra" "$tools\ghidra_12.1.4_PUBLIC"
          Get-Item "$tools\current-ghidra" | Select-Object Name, LinkType, Target
          $work = Join-Path $env:TEMP ('junc-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $fixture = Join-Path $work 'demo.exe'
          Copy-Item .\examples\bin\windows-x64\demo.exe $fixture -Force
          $log = Join-Path $work 'ghidra'
          & "$tools\current-ghidra\support\analyzeHeadless.bat" (Join-Path $work 'proj') p -import $fixture -log $log
          Write-Output "JUNCTION HEADLESS EXIT=$LASTEXITCODE"
          if (Test-Path "$log.log") { Get-Content "$log.log" -Tail 40 }

      - name: REA analyze 走真实路径
        shell: pwsh
        continue-on-error: true
        run: |
          $work = Join-Path $env:TEMP ('rea-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $fixture = Join-Path $work 'demo.exe'
          Copy-Item .\examples\bin\windows-x64\demo.exe $fixture -Force
          $env:GHIDRA_INSTALL_DIR = 'C:\Users\runneradmin\tools\ghidra_12.1.4_PUBLIC'
          $env:JAVA_HOME = 'C:\Users\runneradmin\tools\jdk-21.0.12.1+1'
          npx -y rea-agents@6.8.0 analyze $fixture --provider ghidra --format json
          Write-Output "REA EXIT=$LASTEXITCODE"
