name: Deploy docs (GitHub Pages)

# 只在 main 分支 push 与手动触发时部署（PR 不部署）。
# 不在 tag 上触发：tag 与 main 指向同一 commit，重复触发会并发争抢 Pages 部署锁导致其中一次失败。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 固定并发组：任何重叠的部署（push 与手动）都取消旧的，只保留一次，杜绝部署锁冲突。
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # 不启用 cache: pip —— 没有 requirements.txt/lockfile，setup-python 的缓存会找不到文件而失败。

      - name: Install mkdocs toolchain
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material mkdocs-static-i18n

      - name: Build docs (strict)
        run: mkdocs build --strict --site-dir _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
